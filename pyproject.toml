[project]
name = "whatsapp-agent-bootstrap"
version = "0.1.0"
description = "Template bootstrap de agentes de IA no WhatsApp, gerenciado no GCP (Vertex AI + Cloud Run + Pub/Sub + Cloud SQL/PgVector)."
requires-python = ">=3.11,<3.14"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
